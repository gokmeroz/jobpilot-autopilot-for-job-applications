mode: review_first # review_first | full_auto | manual_only (never auto-apply)

markets:
  countries: [DE, NL, IE, GB, TR]
  remote_worldwide: true

# Keyword search matrix for JSearch, Adzuna and LinkedIn: every role is
# searched in every market (roles × markets queries per source, per run).
# Region flags (--eu, --turkey, ...) narrow the markets for that run.
# Trim roles here if API quota / Apify cost gets too high.
search:
  roles:
    - junior software engineer
    - graduate software engineer
    - new grad software engineer
    - associate software engineer
    - junior backend developer
    - junior full stack developer
    - junior frontend developer
    - junior python developer
    - junior node.js developer
    - junior AI engineer
    - software engineer I
    - junior backend engineer
    - junior full stack engineer
    - LLM engineer
    - applied AI engineer
    - AI application engineer
    - product engineer
    - solutions engineer
  markets: # ISO2 (or REMOTE) -> name used in the search query
    DE: Germany
    NL: Netherlands
    IE: Ireland
    GB: United Kingdom
    TR: Turkey
    REMOTE: remote

limits:
  per_country_min: 15 # discovery target, not a guarantee
  turkey_max: 50

gate:
  max_age_hours: 24
  max_yoe: 1
  languages: [EN, TR] # DE-language postings pass only if german_ok
  german_ok: true # candidate has B2 — accept German postings
  # Staffing agencies / job aggregators that repost other companies' jobs.
  # Matched against the company name, ignoring case, spaces and punctuation.
  company_blocklist:
    - Hire Feed
    - Hired
    - Quik Hire Staffing
    - Jobgether
    - Jack & Jill
    - Jobright.ai
    - Jobs Ai
    - Jobs via Dice
    - ChatGPT Jobs
    - FetchJobs.co
    - RemoteHunter
    - Joinrs
    - hackajob
    - WE ARE DEVELOPERS
    - European Tech Recruit
    - Hunter Bond
    - HeadFirst Group
    - Talenthaus
    # AI-training gig platforms
    - DataAnnotation
    - Alignerr

score:
  threshold: 6.5
  model: claude-haiku-4-5-20251001  # fast + cheap for scoring; swap to claude-sonnet-4-6 for higher quality
  max_llm_calls_per_run: 200 # cost guard; prescore must cut volume below this

apply:
  dry_run: false  # true = fill + screenshot, never click submit
  headless: true
  max_attempts: 2
  allow_select_fallback: true  # true = choose first non-placeholder option for unknown dropdowns
  resume_file: assets/resume/resume.pdf
  cover_letter_short: assets/cover_letters/cover_letter_long.md # one letter for every application
  cover_letter_long: assets/cover_letters/cover_letter_long.md

  # Stealth mode: activates the full anti-bot-detection stack.
  # human_like + JS evasions + playwright_stealth + realistic headers/viewport.
  # use_cdp: true is the recommended setting for all real applications.
  use_cdp: true

  # human_like: add randomized delays and mouse movements between field fills
  # to reduce bot-detection by ATS platforms. Slightly slower but much safer.
  human_like: true

source_health:
  auto_disable_broken: false # if true, a source verdicted "broken" is skipped on future `--source all` runs until an explicit `--source <id>` run recovers it (human confirmation)
  min_avg_for_yield_drop: 3 # only flag a 0-result run as broken if the historical average was at least this many results — avoids false positives on naturally tiny/flaky sources

paths:
  runs: runs
  history: history
  manual_queue: manual_queue
  ledger: data/ledger.sqlite

sheet:
  worksheet: "ALL APPLICATIONS"
  columns:
    [
      DATE,
      COUNTRY,
      COMPANY,
      POSITION,
      LOCATION,
      TYPE,
      SALARY,
      LANGUAGE,
      STAGE,
      SITUATION,
    ]
  stage_applied: APPLIED
  stage_queued: QUEUED
  situation_default: "ON GOING"
  country_display: # ISO2 -> sheet display value
    DE: Germany
    NL: Netherlands
    IE: Ireland
    GB: "UK / England"
    TR: Turkey
    US: USA
    REMOTE: Worldwide

ghost_after_days: 21

apify:
  actor_id: "curious_coder/linkedin-jobs-scraper"
  wellfound_actor_id: "crawlerbros/wellfound-scraper"
  timeout_secs: 300       # max seconds to wait for actor run
  pages_per_query: 1      # results per search URL (25 jobs/page)
